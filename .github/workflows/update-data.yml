name: Update BBM dashboard data

on:
  schedule:
    # Tiap hari jam 05:00 WIB (22:00 UTC hari sebelumnya)
    - cron: "0 22 * * *"
  workflow_dispatch: {} # tombol "Run workflow" manual di tab Actions

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch live prices & update data.json
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: node scripts/update-data.mjs

      - name: Commit & push if data.json changed
        run: |
          git config user.name "bbm-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "chore: update ICP/kurs otomatis $(date -u +'%Y-%m-%d')"
            git push
          fi
